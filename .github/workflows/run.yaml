name: Git Subtree Pull Test

on:
  workflow_dispatch:  # ???????

jobs:
  subtree-pull:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # subtree ??????????

      - name: Set up Git user 
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare subtree directory
        run: |
          if [ ! -d aaa ]; then
            git remote add subtree-test https://github.com/mechaginton/practice.git
            echo "First time setup: adding subtree"
            git subtree add --prefix=aaa --squash subtree-test master
          else
            echo "Subtree exists: pulling latest"
            git subtree pull --prefix=aaa --squash subtree-test master
          fi

      - name: Push changes
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .
          git commit -m "Update subtree: sync with practice repo" || echo "Nothing to commit"
          git push origin HEAD