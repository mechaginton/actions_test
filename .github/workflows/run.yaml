name: Git Subtree Pull Test

on:
  workflow_dispatch:  # ???????

jobs:
  subtree-pull:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # subtree ??????????

      - name: Set up Git user 
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare subtree directory
        run: |
          if [ ! -d subtree ]; then
            echo "First time setup: adding subtree"
            git subtree add --prefix=subtree https://github.com/mechaginton/practice.git master --squash
          else
            echo "Subtree exists: pulling latest"
            git subtree pull --prefix=subtree https://github.com/mechaginton/practice.git master --squash
          fi