name: Git Subtree Pull Test

on:
  workflow_dispatch:  # ???????

jobs:
  subtree-pull:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # subtree ??????????

      - name: Set up Git user 
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull subtree from external repo
        run: |
          git subtree pull --prefix=subtree https://github.com/mechaginton/practice.git main --squash
